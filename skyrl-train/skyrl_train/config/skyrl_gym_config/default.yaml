# @package environment.skyrl_gym
max_env_workers: 32

text2sql:
  db_path: "/home/ray/default/sql_data"

llm_as_a_judge:
  model: "gpt-4o-mini"
  base_url: null

search:
  log_requests: false
  search_url: "http://127.0.0.1:8000/retrieve"
  topk: 3
  timeout: 30

aime:
  evaluation_token_budget: 8192
  length_penalty_weight: 0.0
  target_length: 768
  truncated_penalty: -2.0
  min_response_length: 16
  max_gen_length: 0

nemotron_if:
  # Tokenizer used to decode the answer tokens that follow the end-of-thinking token (required).
  tokenizer_path: null
  # Minimum tokens inside a closed thinking block for a response to be rewarded; 0 = no requirement.
  min_thinking_tokens: 0

# nemotron_if under a harness-style prompt: the answer is one JSON object and `response` is checked.
nemotron_if_json:
  tokenizer_path: null
  min_thinking_tokens: 0
